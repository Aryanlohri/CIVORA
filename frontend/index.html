<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],

            colors: {

                100: '#e0effe',
                200: '#bae0fd',

                400: '#36abf7',

                600: '#0171c7',
                700: '#025aa1',
                800: '#064d85',
                900: '#0b416f',
                950: '#072a4a',
              }

          }
        }
      }
    </script>

    <!-- React 18, ReactDOM, and Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #020617;
        color: #f8fafc;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      .pulse-glow {
        animation: pulseGlow 3s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>

    <!-- Application Script written in JSX and transpiled by Babel in the browser -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const API_BASE = 'http://localhost:8000/api';

      // --- SVG ICONS ---
      const Icon = ({ name, className = "w-4 h-4" }) => {
        switch (name) {
          case 'network':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" />
                <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" />
              </svg>
            );
          case 'layers':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" />
              </svg>
            );
          case 'search':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            );
          case 'check':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
              </svg>
            );
          case 'pin':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" />
              </svg>
            );
          case 'settings':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
              </svg>
            );
          case 'zap':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
              </svg>
            );
          case 'download':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            );
          case 'external':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" />
              </svg>
            );
          case 'shield':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
            );
          case 'droplet':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
              </svg>
            );
          case 'sprout':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 20h10" /><path d="M10 20c5.5-2.5.8-6.4 3-13" /><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" /><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" />
              </svg>
            );
          case 'banknote':
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" />
              </svg>
            );
          default:
            return (
              <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10" />
              </svg>
            );
        }
      };

      // --- MAIN APPLICATION ---
      function SchemeConnectApp() {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [apiOnline, setApiOnline] = useState(false);
        const [summary, setSummary] = useState(null);
        const [schemes, setSchemes] = useState([]);
        const [selectedScheme, setSelectedScheme] = useState(null);
        const [demoBanner, setDemoBanner] = useState(false);

        // Convergence State
        const [objectives, setObjectives] = useState([]);
        const [selectedObjectiveKey, setSelectedObjectiveKey] = useState('farmer_development');
        const [selectedDistrict, setSelectedDistrict] = useState('Sehore');
        const [selectedBlock, setSelectedBlock] = useState('All Blocks');
        const [targetPersona, setTargetPersona] = useState('Small and Marginal Farmers (< 5 acres)');
        const [convergenceResult, setConvergenceResult] = useState(null);
        const [loadingConvergence, setLoadingConvergence] = useState(false);
        const [downloadingPdf, setDownloadingPdf] = useState(false);

        // Eligibility State
        const [eligibilityForm, setEligibilityForm] = useState({
          state: 'Madhya Pradesh',
          district: 'Sehore',
          age: 42,
          gender: 'Male',
          occupation: 'Farmer',
          landholding_acres: 2.5,
          annual_income: 95000,
          social_category: 'OBC',
          has_bank_account: true,
          has_aadhaar: true,
          irrigation_available: false
        });
        const [eligibilityResult, setEligibilityResult] = useState(null);
        const [evaluatingEligibility, setEvaluatingEligibility] = useState(false);

        // Search & Filters
        const [searchQuery, setSearchQuery] = useState('');
        const [filterSector, setFilterSector] = useState('All');
        const [filterLevel, setFilterLevel] = useState('All');
        const [filterState, setFilterState] = useState('All');
        const [filterOccupation, setFilterOccupation] = useState('All');
        const [filterGender, setFilterGender] = useState('All');

        // Admin State
        const [adminRules, setAdminRules] = useState([]);
        const [showAddScheme, setShowAddScheme] = useState(false);
        const [showAddRule, setShowAddRule] = useState(false);

        // Initial Data Fetch
        useEffect(() => {
          async function initData() {
            try {
              const [healthRes, summaryRes, schemesRes, objsRes] = await Promise.all([
                fetch(`${API_BASE}/health`).then(r => r.json()).catch(() => ({ status: 'offline' })),
                fetch(`${API_BASE}/dashboard/summary`).then(r => r.json()).catch(() => null),
                fetch(`${API_BASE}/schemes`).then(r => r.json()).catch(() => []),
                fetch(`${API_BASE}/convergence/objectives`).then(r => r.json()).catch(() => [])
              ]);

              if (healthRes && healthRes.status === 'ok') setApiOnline(true);
              if (summaryRes) setSummary(summaryRes);
              if (schemesRes) setSchemes(schemesRes);
              if (objsRes) setObjectives(objsRes);

              // Auto-run initial convergence for live demo readiness!
              runConvergenceEngine('farmer_development', 'Sehore');
              runEligibilityCheck();
            } catch (err) {
              console.error("Init data load failed:", err);
            }
          }
          initData();
        }, []);

        const runConvergenceEngine = async (objKey, dist) => {
          setLoadingConvergence(true);
          try {
            const res = await fetch(`${API_BASE}/convergence/calculate`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                objective_key: objKey,
                state: 'Madhya Pradesh',
                division: 'Bhopal',
                district: dist,
                target_group: targetPersona
              })
            });
            const data = await res.json();
            setConvergenceResult(data);
          } catch (err) {
            console.error("Convergence calculation error:", err);
          } finally {
            setLoadingConvergence(false);
          }
        };

        const runEligibilityCheck = async () => {
          setEvaluatingEligibility(true);
          try {
            const res = await fetch(`${API_BASE}/eligibility/check`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(eligibilityForm)
            });
            const data = await res.json();
            setEligibilityResult(data);
          } catch (err) {
            console.error("Eligibility check error:", err);
          } finally {
            setEvaluatingEligibility(false);
          }
        };

        const handleLaunchDemo = () => {
          setActiveTab('convergence');
          setSelectedObjectiveKey('farmer_development');
          setSelectedDistrict('Sehore');
          setTargetPersona('Small and Marginal Farmers (< 5 acres)');
          setDemoBanner(true);
          runConvergenceEngine('farmer_development', 'Sehore');
        };

        const handleDownloadPdf = async () => {
          setDownloadingPdf(true);
          try {
            const res = await fetch(`${API_BASE}/convergence/export-pdf`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                objective_key: selectedObjectiveKey,
                state: 'Madhya Pradesh',
                division: 'Bhopal',
                district: selectedDistrict,
                target_group: targetPersona
              })
            });
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Strategic_Convergence_Report_${selectedDistrict}_${selectedObjectiveKey}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
          } catch (err) {
            console.error("PDF download failed:", err);
            alert("Could not download PDF report from backend.");
          } finally {
            setDownloadingPdf(false);
          }
        };

        // Filtered Schemes
        const filteredSchemes = schemes.filter(s => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = s.name.toLowerCase().includes(q);
            const matchCode = s.code.toLowerCase().includes(q);
            const matchDesc = s.description.toLowerCase().includes(q);
            const matchDept = s.department.toLowerCase().includes(q);
            if (!matchName && !matchCode && !matchDesc && !matchDept) return false;
          }
          if (filterSector !== 'All' && s.sector !== filterSector) return false;
          if (filterLevel !== 'All' && s.level !== filterLevel) return false;
          if (filterState !== 'All' && s.state !== filterState && s.state !== 'All India') return false;
          return true;
        });

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
            
            {/* National Color Ribbon */}
            <div className="h-1.5 w-full bg-gradient-to-r from-amber-500 via-white to-emerald-600" />

            {/* Top Navigation Bar */}
            <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="flex items-center justify-between h-16">
                  
                  {/* Brand */}
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center shadow-lg shadow-blue-500/20 border border-blue-400/30">
                      <Icon name="network" className="w-5 h-5 text-white" />
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-blue-400 via-indigo-200 to-emerald-400 bg-clip-text text-transparent">
                          SchemeConnect AI
                        </span>
                        <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800 font-mono">
                          SEG-6
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 leading-tight">
                        Government Scheme Intelligence & Convergence Platform
                      </p>
                    </div>
                  </div>

                  {/* Actions & Status */}
                  <div className="flex items-center gap-3">
                    <button
                      onClick={handleLaunchDemo}
                      className="hidden sm:flex items-center gap-2 px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-semibold shadow-md shadow-emerald-950/50 border border-emerald-400/30 transition-all hover:scale-[1.02] active:scale-[0.98]"
                    >
                      <Icon name="zap" className="w-3.5 h-3.5 text-amber-300" />
                      <span>⚡ Live Demo: Sehore Farmer Convergence</span>
                    </button>

                    <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium border ${
                      apiOnline 
                        ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800/60' 
                        : 'bg-amber-950/60 text-amber-400 border-amber-800/60'
                    }`}>
                      <span className={`w-2 h-2 rounded-full ${apiOnline ? 'bg-emerald-500' : 'bg-amber-500'}`} />
                      <span>{apiOnline ? 'FastAPI Active' : 'Connecting...'}</span>
                    </div>
                  </div>
                </div>

                {/* Tabs */}
                <div className="flex space-x-1 overflow-x-auto py-2 scrollbar-none border-t border-slate-800/60">
                  {[
                    { id: 'dashboard', label: 'Dashboard', icon: 'layers', badge: null },
                    { id: 'convergence', label: 'Convergence Studio', icon: 'network', badge: 'Core MVP' },
                    { id: 'database', label: 'Scheme Database', icon: 'search', badge: `${schemes.length} Schemes` },
                    { id: 'eligibility', label: 'Eligibility Checker', icon: 'check', badge: null },
                    { id: 'district', label: 'District (Sehore, MP)', icon: 'pin', badge: 'Pilot' },
                    { id: 'admin', label: 'Admin Panel', icon: 'settings', badge: null }
                  ].map(tab => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs font-semibold transition-all whitespace-nowrap ${
                          isActive
                            ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30'
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                        }`}
                      >
                        <Icon name={tab.icon} className={`w-4 h-4 ${isActive ? 'text-white' : 'text-slate-400'}`} />
                        <span>{tab.label}</span>
                        {tab.badge && (
                          <span className={`text-[10px] px-1.5 py-0.2 rounded-full font-bold ${
                            isActive ? 'bg-blue-800 text-blue-100' : 'bg-slate-800 text-slate-300 border border-slate-700'
                          }`}>
                            {tab.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            </header>

            {/* Demo Notification Banner */}
            {demoBanner && (
              <div className="bg-gradient-to-r from-emerald-950 via-teal-900 to-slate-900 border-b border-emerald-500/40 px-4 py-2 text-xs text-emerald-200 shadow-lg">
                <div className="max-w-7xl mx-auto flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping shrink-0" />
                    <span className="font-bold">Live Demonstration Mode:</span>
                    <span>Agricultural Productivity & Income Convergence in Sehore District, Madhya Pradesh (SEG-6 Presentation Scenario)</span>
                  </div>
                  <button onClick={() => setDemoBanner(false)} className="text-emerald-400 hover:text-white font-bold ml-4">✕</button>
                </div>
              </div>
            )}

            {/* Main Content Body */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
              
              {/* TAB 1: UNIFIED DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-8 animate-in fade-in duration-300">
                  
                  {/* Hero Showcase */}
                  <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-blue-950 via-indigo-950 to-slate-900 border border-blue-500/30 p-8 shadow-2xl">
                    <div className="relative z-10 max-w-4xl">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 border border-blue-400/30 text-xs font-semibold mb-3">
                        <span className="w-2 h-2 rounded-full bg-blue-400 animate-ping" />
                        <span>SEG-6 Final Deliverable • SchemeConnect AI</span>
                      </div>
                      <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight">
                        Centralized Scheme Intelligence & <br />
                        <span className="bg-gradient-to-r from-blue-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">
                          Strategic Convergence Mapping Tool
                        </span>
                      </h1>
                      <p className="mt-3 text-slate-300 text-sm sm:text-base leading-relaxed max-w-3xl">
                        Eliminates fragmented scheme silos by bridging ministries, evaluating citizen eligibility,
                        and mapping how multiple schemes (PM-KISAN, PMKSY, PMFBY, Soil Health Card) combine to achieve unified development outcomes.
                      </p>

                      <div className="mt-6 flex flex-wrap items-center gap-4">
                        <button
                          onClick={handleLaunchDemo}
                          className="px-6 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-950/50 flex items-center gap-2 transition-all hover:scale-[1.02] border border-emerald-300/30"
                        >
                          <Icon name="zap" className="w-4 h-4 text-amber-300" />
                          <span>Launch Sehore Agri-Convergence Demo</span>
                        </button>
                        <button
                          onClick={() => setActiveTab('convergence')}
                          className="px-5 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 font-semibold text-sm border border-slate-700 flex items-center gap-2"
                        >
                          <Icon name="network" className="w-4 h-4 text-blue-400" />
                          <span>Open Convergence Studio</span>
                        </button>
                        <button
                          onClick={() => setActiveTab('database')}
                          className="px-5 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 font-semibold text-sm border border-slate-700 flex items-center gap-2"
                        >
                          <span>Explore 25 Verified Schemes</span>
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* 4 Metric Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Active Verified Schemes</span>
                      <div className="text-3xl font-extrabold text-white mt-1">25 Schemes</div>

                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* Scheme Details Modal */}
            {selectedScheme && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-in fade-in duration-200">
                <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800 uppercase font-mono">{selectedScheme.code}</span>
                        <span className="text-[10px] text-emerald-400 font-semibold">{selectedScheme.sector}</span>
                      </div>
                      <h2 className="text-xl font-bold text-white mt-1">{selectedScheme.name}</h2>
                      {selectedScheme.hindi_name && (
                        <p className="text-sm text-blue-300">{selectedScheme.hindi_name}</p>
                      )}
                    </div>
                    <button onClick={() => setSelectedScheme(null)} className="text-slate-400 hover:text-white font-bold p-1">✕</button>
                  </div>

                  <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 leading-relaxed">
                    {selectedScheme.description}
                  </p>

                  <div className="text-xs bg-slate-950/60 p-3 rounded-xl border border-slate-800 space-y-1">
                    <p><b>Ministry:</b> {selectedScheme.ministry}</p>
                    <p><b>Department:</b> {selectedScheme.department}</p>
                    <p><b>Target Beneficiary:</b> {selectedScheme.target_beneficiary}</p>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    {selectedScheme.application_url && (
                      <a href={selectedScheme.application_url} target="_blank" rel="noreferrer" className="px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold">
                        Visit Official Portal
                      </a>
                    )}
                    <button onClick={() => setSelectedScheme(null)} className="px-4 py-2 rounded-lg bg-slate-800 text-slate-200 text-xs font-semibold">
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="border-t border-slate-900 bg-slate-950 py-6 mt-12 text-slate-500 text-xs">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-blue-500" />
                  <span className="font-bold text-slate-400">SchemeConnect AI • SEG-6 Final Deliverable</span>
                </div>
                <div className="text-slate-500">
                  Team SEG-6: Aryan Lohri, Abhiraj Kumar, Milan Kohli, Kamal Gangwar, Arsalan
                </div>
              </div>
            </footer>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SchemeConnectApp />);
    </script>
  </body>
</html>
